version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      maven-dependencies:
        patterns:
          - "*"
    ignore:
      # hazelcast-all is declared at provided scope: the runtime Hazelcast
      # is supplied by Jahia, not by this bundle. See SECURITY.md for the
      # full rationale on GHSA Hazelcast client-protocol permission checks.
      - dependency-name: "com.hazelcast:hazelcast-all"
      # The jahia-modules parent and org.jahia.* artifacts define the target
      # Jahia platform version: bumped deliberately, never by Dependabot.
      - dependency-name: "org.jahia.*"
      # OSGi spec artifacts (e.g. DS annotations 1.5) raise Require-Capability /
      # Import-Package floors above what Jahia 8.2 provides (Felix SCR 2.1.30 = DS 1.4).
      - dependency-name: "org.osgi:*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # Module Federation shared libraries: majors must match the Jahia runtime.
      - dependency-name: "@jahia/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@apollo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-i18next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "i18next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql-tag"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redux"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-redux"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 conflicts with react-i18next peer range (typescript ^5 || ^6).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Babel 8 (#120): presets need @babel/core 8 and Node >= 22.18; coordinated migration.
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      # ESLint 10 drops eslintrc support; @jahia/eslint-config 2.x and .eslintrc are eslintrc-based.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/tests"
    schedule:
      interval: "weekly"
    groups:
      npm-tests-dependencies:
        patterns:
          - "*"
    ignore:
      # cross-fetch >= 3.2.0 hands back an unbound window.fetch; under @jahia/cypress 7 the e2e
      # GraphQL calls then fail with "TypeError: Illegal invocation" (2026-11 e2e runs). Stay on
      # 3.1.x until this harness moves to @jahia/cypress 8, where cross-fetch 4 works.
      - dependency-name: "cross-fetch"
        versions: [">=3.2.0"]
      - dependency-name: "cypress"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@jahia/cypress"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Shared libs kept aligned with the module / Jahia GraphQL API.
      - dependency-name: "@apollo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql-tag"
        update-types: ["version-update:semver-major"]
