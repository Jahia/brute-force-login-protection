# default configuration - won't be overridden
# Brute-force login protection — example jail.
# Filename pattern: org.jahia.community.bruteforceloginprotection.jail-<discriminator>.cfg
# Copy this file once per jail you want; the 'name' property is the jail identifier
# (and must be unique across all jail-*.cfg files in karaf/etc).

name=login
enabled=true
max_retry=5
find_time_seconds=600
ban_time_seconds=600
