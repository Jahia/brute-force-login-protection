# default configuration - won't be overridden
# Brute-force login protection — global settings.
# Edit and Felix file-install will reload the values without a restart.
# Updates done through the admin UI re-write this file via ConfigurationAdmin.

activated=false
whitelist_ips=127.0.0.1/32,::1/128
# Comma-separated regexes matched against the USERNAME (anchored full-match, lower-cased).
# Use for accounts whose failed logins are noise: monitoring probes, batch jobs, health checks.
# Avoid repeating a group that contains * or + -- e.g. (.*a){20} backtracks for ~101s on a
# 32-char username. Such entries are dropped at load with a WARN. If a pattern cannot be
# evaluated within 50ms the login failure is COUNTED rather than exempted, so an over-expensive
# pattern can get the account it protects banned. Example value:
# ignore_patterns=^service-.*$,^nagios$
ignore_patterns=
# Comma-separated literal URI substrings (NOT regex, case-sensitive). Requests whose URI
# contains any entry are exempt from failure detection — for non-login endpoints that may be
# hit with a stale/wrong Authorization header. Ban enforcement is unaffected. Example value:
# ignore_paths=modules-repository.moduleList.json
ignore_paths=
trust_x_forwarded_for=false
trusted_proxy_cidrs=
email_enabled=false
email_recipient=
webhook_url=
# Paste a plaintext secret here on first install; the module re-encrypts it
# (prefix {enc}) on the next save through the admin UI.
webhook_secret=
audit_log_max_entries=1000
recidive_factor=2.0
max_ban_time_seconds=604800
# Static blocklist: comma-separated IPs/CIDRs that are always blocked at the auth valve
# (whitelisted IPs take precedence and are never blocked).
blocklist_ips=
# Dynamic blocklist of Tor exit addresses, fetched per node on a schedule.
# On fetch failure the last successfully fetched list stays enforced.
tor_blocklist_enabled=false
tor_blocklist_url=https://check.torproject.org/exit-addresses
# Refresh interval in seconds, clamped to [300, 604800].
tor_blocklist_refresh_seconds=3600
