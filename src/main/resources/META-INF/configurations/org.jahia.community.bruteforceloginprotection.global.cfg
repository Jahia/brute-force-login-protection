# default configuration - won't be overridden
# Brute-force login protection — global settings.
# Edit and Felix file-install will reload the values without a restart.
# Updates done through the admin UI re-write this file via ConfigurationAdmin.

activated=false
whitelist_ips=127.0.0.1/32,::1/128
ignore_patterns=
trust_x_forwarded_for=false
trusted_proxy_cidrs=
email_enabled=false
email_recipient=
webhook_url=
# Paste a plaintext secret here on first install; the module re-encrypts it
# (prefix {enc}) on the next save through the admin UI.
webhook_secret=
audit_log_max_entries=1000
recidive_factor=2.0
max_ban_time_seconds=604800
