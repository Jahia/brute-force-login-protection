mutation saveJail(
    $name: String!
    $enabled: Boolean
    $maxRetry: Int
    $findTimeSeconds: Int
    $banTimeSeconds: Int
) {
    bruteForceLoginProtection {
        saveJail(
            name: $name
            enabled: $enabled
            maxRetry: $maxRetry
            findTimeSeconds: $findTimeSeconds
            banTimeSeconds: $banTimeSeconds
        )
    }
}
